    concurrent_users:
    - 1
    - 5
    - 10
    - 20
    data_volume_multipliers:
    - 1
    - 2
    - 5
    - 10
  memory_threshold_warning_mb: 8192
  resource_monitoring_interval: 1.0
  save_metrics_json: true
  separate_experiment: true
  thresholds:
    max_cpu_usage_percent: 80
    max_memory_usage_percent: 85
    max_processing_time_per_record_ms: 100
    min_partition_efficiency: 0.7
    min_scalability_score: 0.6
    min_throughput_records_per_second: 100
spark:
  app_name: StockForecastingPipeline
  configs:
    spark.driver.extraJavaOptions: -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=35
    spark.driver.maxResultSize: 4g
    spark.driver.memoryFraction: '0.8'
    spark.executor.extraJavaOptions: -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=35
    spark.executor.memoryFraction: '0.8'
    spark.io.compression.codec: snappy
    spark.ml.cache.enabled: 'true'
    spark.mllib.cache.enabled: 'true'
    spark.rdd.compress: 'true'
    spark.serializer: org.apache.spark.serializer.KryoSerializer
    spark.sql.adaptive.advisoryPartitionSizeInBytes: 32MB
    spark.sql.adaptive.coalescePartitions.enabled: 'true'
    spark.sql.adaptive.enabled: 'true'
    spark.sql.adaptive.localShuffleReader.enabled: 'true'
    spark.sql.adaptive.maxNumPostShufflePartitions: '64'
    spark.sql.adaptive.skewJoin.enabled: 'true'
    spark.sql.broadcastTimeout: '36000'
    spark.sql.execution.arrow.maxRecordsPerBatch: '10000'
    spark.sql.execution.arrow.pyspark.enabled: 'true'
  driver_memory: 12g
  executor_cores: 4
  executor_memory: 10g
  master: local[8]
visualization:
  colors:
    primary: '#1f77b4'
    secondary: '#ff7f0e'
    success: '#2ca02c'
    warning: '#d62728'
  dpi: 300
  figure_size:
  - 12
  - 8
  save_format: png
  style: seaborn-v0_8
